# Academic publishers and the traces that identify them.
#
# Used to fill in metadata.publisher for rows that do not name one (KC Works
# needs a publisher to register a DOI). Each entry may give any of:
#
#   statement     phrases looked for in a copyright / publication statement,
#                 as whole words, in any letter case
#   acronyms      short names looked for as whole words in exactly this case
#                 (so "SAGE" the publisher is not "sage" the adjective)
#   doi_prefixes  DOI registrant prefixes that belong to this publisher alone
#   hosts         web domains of the publisher's own platform (subdomains
#                 are included: "wiley.com" covers onlinelibrary.wiley.com)
#
# Deliberately absent, because they carry many publishers' work and so
# identify none: JSTOR (10.2307, jstor.org), Project MUSE (10.1353,
# muse.jhu.edu), BioOne, GeoScienceWorld, PubMed, PsycNET, ResearchGate,
# EBSCO, ProQuest, Ingenta, SSRN, arXiv and the like.
#
# To add a publisher, add a [[publisher]] block; no code changes are needed.

