[project]
name = "bepress-importer"
version = "1.0.0"
description = "Convert Bepress (Digital Commons) batch exports to KC Works import JSON, with an auditable wrangling workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "rich>=13",
    "requests>=2.31",
]

[project.scripts]
bepress-importer = "bepress_importer.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "commitizen>=3",
    "xlwt>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bepress_importer"]

[tool.commitizen]
version = "1.0.0"
version_files = [
    "__version__.py",
    "pyproject.toml:version",
]
update_changelog_on_bump = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
