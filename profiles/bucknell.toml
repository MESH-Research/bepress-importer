  transform = "split"
  args = { sep = "," }

  [[sheet.field]]
  source = "disciplines"
  target = "/custom_fields/kcr:discipline"
  transform = "split"
  args = { sep = ";", join = ", " }

  [[sheet.field]]
  source = "degree_name"
  target = "/custom_fields/kcr:degree"

  [[sheet.field]]
  source = "department"
  target = "/custom_fields/kcr:institution_department"

  [[sheet.field]]
