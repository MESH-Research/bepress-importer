# Bucknell University Bepress export → KC Works mapping profile.
#
# Revised per the client's mapping instructions (bucknell_mapping.odt,
# 2026-08); every change is documented in profiles/bucknell_remapping.MD.
#
# Conventions from those instructions:
#   - custom_fields.kcr:publication_url is reserved for the *larger*
#     publication (journal/series as a whole); URLs for the work itself go
#     to metadata.identifiers (scheme url). No sheet currently maps
#     kcr:publication_url.
#   - Nested custom fields keep both namespace words: thesis:thesis,
#     journal:journal, imprint:imprint.
#
# Deliberately unmapped columns (documented, not accidental):
#   all sheets:  ctmtime (Unix epoch of last Bepress *modification*, not
#                creation — pending client confirmation before mapping to
#                the record "created" timestamp), season (consumed via
#                edtf_date's season_column arg), issue (consumed as the
#                collection slug)
#   Fac Journal Articles: open_access (workflow flag), department2 (the
#                theses-only department2 instruction was not extended to
#                other sheets), update_reason
#   Theses:      multimedia_url (mixed junk/YouTube/Kaltura embeds —
#                pending clarification), concentration is now merged into
#                disciplines
#   Books/Press: cover_image_url (empty), create_openurl (per instruction:
#                rely on access.files permissions), multimedia_url (mixed
#                dates/URLs — pending clarification), update_reason
#   Podcasts:    contributor (mixed personal names and affiliations —
#                pending clarification)

[profile]
name = "bucknell"
schema_version = 1

[defaults]
record_id.column = "context_key"
url_identifier.column = "calc_url"
files_enabled = false
season_style = "edtf-season"

[defaults.author_columns]
prefix = "author"
max = 32

# ---------------------------------------------------------------- journals
[[sheet]]
match = "Fac Journal Articles"

  [sheet.resource_type]
  column = "document_type"
  map = { article = "textDocument-journalArticle", book_contribution = "textDocument-bookSection", popular_press = "textDocument-magazineArticle", other = "textDocument-other" }
  default = "textDocument-journalArticle"

  [[sheet.field]]
  source = "title"
  target = "/metadata/title"
  required = true

  [[sheet.field]]
  source = "publication_date"
  target = "/metadata/publication_date"
  transform = "edtf_date"
  args = { season_column = "season" }
  required = true

  [[sheet.field]]
  source = "abstract"
  target = "/metadata/description"
  transform = "strip_html"

  [[sheet.field]]
  source = "keywords"
  target = "/custom_fields/kcr:user_defined_tags"
  transform = "split"
  args = { sep = "," }

  [[sheet.field]]
  source = "disciplines"
  target = "/custom_fields/kcr:discipline"
  transform = "split"
  args = { sep = ";", join = ", " }

  [[sheet.field]]
  source = "department"
  target = "/custom_fields/kcr:institution_department"

  [[sheet.field]]
  source = "pub_link"
  target = "/metadata/identifiers"
  transform = "identifier"
  args = { scheme = "url" }
  append = true

  [[sheet.field]]
  source = "doi"
  target = "/metadata/identifiers"
  transform = "identifier"
  args = { scheme = "doi", normalize = "doi" }
  append = true

  [[sheet.field]]
  source = "comments"
  target = "/metadata/additional_descriptions"
  transform = "additional_description"
  append = true

  [[sheet.field]]
  source = "custom_citation"
  target = "/metadata/additional_descriptions"
  transform = "additional_description"
  append = true

  [[sheet.field]]
  source = "pub_statement"
  target = "/metadata/copyright"
  transform = "strip_html"

  [[sheet.field]]
  source = "embargo_date"
  target = "/access"
  transform = "embargo"

  [sheet.journal]
  title = "src_journal"
  volume = "volnum"
  issue = "issnum"
  pages = { first = "fpage", last = "lpage" }

# ---------------------------------------------------------------- theses
[[sheet]]
match = "Masters Theses"

  [sheet.resource_type]
  column = "document_type"
  map = { masters_thesis = "textDocument-thesis", masters_thesis_b = "textDocument-thesis" }
  default = "textDocument-thesis"

  [sheet.contributors]
  prefix = "advisor"
  max = 3
  role = "committeeMember"

  [[sheet.field]]
  source = "title"
  target = "/metadata/title"
  required = true

  [[sheet.field]]
  source = "publication_date"
  target = "/metadata/publication_date"
  transform = "edtf_date"
  args = { season_column = "season" }
  required = true

  [[sheet.field]]
  source = "abstract"
  target = "/metadata/description"
  transform = "strip_html"

  [[sheet.field]]
  source = "keywords"
  target = "/custom_fields/kcr:user_defined_tags"
  transform = "split"
  args = { sep = "," }

  [[sheet.field]]
  source = "disciplines"
  target = "/custom_fields/kcr:discipline"
  transform = "split"
  args = { sep = ";", join = ", ", also_columns = ["concentration"] }

  [[sheet.field]]
  source = "degree_name"
  target = "/custom_fields/thesis:thesis/type"

  [[sheet.field]]
  source = "department"
  target = "/custom_fields/thesis:thesis/department"

  [[sheet.field]]
  source = "department2"
  target = "/custom_fields/kcr:institution_department"

  [[sheet.field]]
  source = "author1_institution"
  target = "/custom_fields/thesis:thesis/university"
  transform = "author_institution"
  args = { prefix = "author", max = 5, default = "Bucknell University" }

  [[sheet.field]]
  source = "multimedia_format"
  target = "/custom_fields/kcr:media"
  transform = "split"
  args = { sep = "," }

  [[sheet.field]]
  source = "comments"
  target = "/metadata/additional_descriptions"
  transform = "additional_description"

  [[sheet.field]]
  source = "embargo_date"
  target = "/access"
  transform = "embargo"

