# Bucknell Content Inventory export → KC Works mapping profile.
#
# A Content Inventory export is a single flattened table: every collection's
# rows with the union of all columns (~585), arriving either as a cp1252 CSV
# or as a "Content Inventory" .xlsx workbook (data sheet plus a "Field Names"
# legend sheet, which `require_columns` keeps out of the conversion). Rows
# carry a `state` column; only `published` rows are imported. Records are
# keyed on `context_key`; inventory exports carry no calc_url, so no url
# identifier is emitted.
#
# `signature_columns` marks this as an inventory profile: `convert` refuses
# to run it against an export that lacks these columns, and suggests it when
# a non-matching profile is passed for an inventory workbook.
#
# The `publication` column holds each row's collection slug, so the
# collection-specific mappings agreed for the Bucknell collection export
# (profiles/bucknell.toml, per bucknell_mapping.odt — see
# profiles/bucknell_remapping.MD) are reproduced here as selected groups:
# rows are routed to the first [[sheet]] block whose `select` matches their
# publication, and everything else falls to the generic catch-all group at
# the end (collection "inventory").
#
# Differences from bucknell.toml forced by the inventory format:
#   - no calc_url column → no url identifier on any record
#   - BU Digital Scholarship: fulltext_url does not exist in inventory
#     exports, so that identifier mapping is dropped
#   - author columns run to author72 in this export (max = 72 below)
#
# Import-readiness rules (KC Works streamlined Import API):
#   - [defaults.doi_pid]: a work that already has a DOI carries it in
#     `pids.doi` (provider "external"), in bare form, so KC Works keeps that
#     DOI instead of minting a second one. The DOI comes from the `doi` column
#     or from a `pub_link` that points at a DOI resolver (doi.org /
#     dx.doi.org, with or without http(s)://); it is then removed from
#     metadata.identifiers. The `doi` field is listed before `pub_link` in
#     each group so the doi column wins if the two ever disagree.
#   - publisher: KC Works needs a publisher to register a DOI for a record
#     that has none of its own. Bepress article rows do not name one, so the
#     `publisher` transform infers it — from a copyright statement naming it,
#     the DOI's registrant prefix, or a link to the publisher's platform (the
#     list is src/bepress_importer/vocab/publishers.toml). Rows with no such
#     trace are left without a publisher.
#   - copyright: only text that reads as a rights statement is imported as
#     copyright; an abstract typed into the statement column becomes the
#     description when the row has none.
#   - Bucknell's own work (theses, DSSRF and digital-scholarship projects,
#     the Bucknell: Occupied podcast) has no outside publisher, so "Bucknell
#     University" is set as a constant for those groups.
#   - titles are reduced to plain text; keywords are split on commas and
#     semicolons; library-proxy links are made public; page/volume cells that
#     hold remarks rather than numbers are left out.
#   - document types: Bucknell's cleaned export uses some KC Works type names
#     directly (poeticWork, videoRecording...); these are mapped alongside the
#     Bepress names.
#
# Deliberately unmapped columns (documented, not accidental): the export
# contains dozens of sparsely-used per-collection columns (exhibition,
# performance, patent, geodata fields, workflow/admin fields such as
# submission_date, submitted_by, open_access, address/phone fields, etc.).
# Run `bepress-importer inspect --profile` for the full unmapped list on a
# given export.

[profile]
name = "inventory-bucknell"
schema_version = 1
signature_columns = ["context_key", "state", "document_type"]

[defaults]
record_id.column = "context_key"
files_enabled = false
season_style = "edtf-season"

[defaults.doi_pid]
provider = "external"

# corporate authors appear only in the `authors` JSON column (their numbered
# author columns are blank), so that column is read for them
[defaults.author_columns]
prefix = "author"
max = 72
json_column = "authors"

# ---------------------------------------------------------------- journals
[[sheet]]
match = "*"
collection = "fac_journ"
require_columns = ["context_key", "state", "document_type"]
select = { column = "publication", values = ["fac_journ"] }

  [sheet.filter]
  column = "state"
  keep = ["published"]

  [sheet.resource_type]
  column = "document_type"
  default = "textDocument-journalArticle"

  [sheet.resource_type.map]
  article = "textDocument-journalArticle"
  journalarticle = "textDocument-journalArticle"
  book_contribution = "textDocument-bookSection"
  popular_press = "textDocument-magazineArticle"
  bookreview = "textDocument-review"
  editorial = "textDocument-editorial"
  other = "textDocument-other"
  # KC Works type names used directly in the cleaned export
  journalArticle = "textDocument-journalArticle"
  poeticWork = "textDocument-poeticWork"
  review = "textDocument-review"
  essay = "textDocument-essay"
  book = "textDocument-book"
  bookSection = "textDocument-bookSection"
  onlinePublication = "textDocument-onlinePublication"
  interactiveResource = "other-interactiveResource"
  videoRecording = "audiovisual-videoRecording"
  musicalRecording = "audiovisual-musicalRecording"
  patent = "other-patent"
  proceedingsPaper = "textDocument-conferenceProceeding"
  conferencePoster = "presentation-conferencePoster"
  "textDocument/other" = "textDocument-other"

  [[sheet.field]]
  source = "title"
  target = "/metadata/title"
  transform = "plain_text"
  required = true

  [[sheet.field]]
  source = "publication_date"
  target = "/metadata/publication_date"
  transform = "edtf_date"
  args = { season_column = "season" }
  required = true

  # an abstract typed into the publication-statement column is used as the
  # description, but only when the row has no abstract (which is applied
  # after it and so always wins)
  [[sheet.field]]
  source = "pub_statement"
  target = "/metadata/description"
  transform = "misplaced_description"
  args = { unless_columns = ["abstract"] }
  append = true

  [[sheet.field]]
  source = "abstract"
  target = "/metadata/description"
  transform = "strip_html"
  append = true

  [[sheet.field]]
  source = "keywords"
  target = "/custom_fields/kcr:user_defined_tags"
  transform = "split"
  args = { sep = [",", ";"] }

  [[sheet.field]]
  source = "disciplines"
  target = "/custom_fields/kcr:discipline"
  transform = "split"
  args = { sep = ";", join = ", " }

  [[sheet.field]]
  source = "department"
  target = "/custom_fields/kcr:institution_department"

  # doi before pub_link: the doi column wins if the two name different DOIs
  [[sheet.field]]
  source = "doi"
  target = "/metadata/identifiers"
  transform = "identifier"
  args = { scheme = "doi", normalize = "doi" }
  append = true

  [[sheet.field]]
  source = "pub_link"
  target = "/metadata/identifiers"
  transform = "identifier"
  args = { scheme = "url", doi_references = true, find_url = true, unproxy = ["ezproxy.bucknell.edu"] }
  append = true

  # a few rows have the DOI typed into the volume or issue cell
  # ("Online First: doi:10…") and nowhere else
  [[sheet.field]]
  source = "volnum"
  target = "/metadata/identifiers"
  transform = "doi_mention"
  append = true

  [[sheet.field]]
  source = "issnum"
  target = "/metadata/identifiers"
  transform = "doi_mention"
  append = true

  [[sheet.field]]
  source = "publisher"
  target = "/metadata/publisher"
  transform = "publisher"
  # add `fallback = "…"` to these args to name a publisher for the rows that
  # nothing identifies (KC Works cannot register a DOI without one)
  args = { statement_columns = ["pub_statement"], doi_columns = ["doi", "volnum", "issnum"], link_columns = ["pub_link"] }

  [[sheet.field]]
  source = "comments"
  target = "/metadata/additional_descriptions"
  transform = "additional_description"
  append = true

  [[sheet.field]]
  source = "custom_citation"
  target = "/metadata/additional_descriptions"
  transform = "additional_description"
  append = true

  [[sheet.field]]
  source = "pub_statement"
  target = "/metadata/copyright"
  transform = "rights_statement"

  [[sheet.field]]
  source = "embargo_date"
  target = "/access"
  transform = "embargo"

  [sheet.journal]
  title = "src_journal"
  volume = "volnum"
  issue = "issnum"
  pages = { first = "fpage", last = "lpage" }

# ---------------------------------------------------------------- theses
[[sheet]]
match = "*"
collection = "masters_theses"
require_columns = ["context_key", "state", "document_type"]
select = { column = "publication", values = ["masters_theses"] }

  [sheet.filter]
  column = "state"
  keep = ["published"]

  [sheet.resource_type]
  column = "document_type"
  map = { masters_thesis = "textDocument-thesis", masters_thesis_b = "textDocument-thesis" }
  default = "textDocument-thesis"

  [sheet.contributors]
  prefix = "advisor"
  max = 3
  role = "committeeMember"

  [[sheet.field]]
  source = "title"
  target = "/metadata/title"
  transform = "plain_text"
  required = true

  [[sheet.field]]
  source = "publication_date"
  target = "/metadata/publication_date"
  transform = "edtf_date"
  args = { season_column = "season" }
  required = true

  [[sheet.field]]
  source = "abstract"
  target = "/metadata/description"
  transform = "strip_html"

  [[sheet.field]]
  source = "keywords"
  target = "/custom_fields/kcr:user_defined_tags"
  transform = "split"
  args = { sep = [",", ";"] }

  [[sheet.field]]
  source = "disciplines"
  target = "/custom_fields/kcr:discipline"
  transform = "split"
  args = { sep = ";", join = ", ", also_columns = ["concentration"] }

  [[sheet.field]]
  source = "degree_name"
  target = "/custom_fields/thesis:thesis/type"

  [[sheet.field]]
  source = "department"
  target = "/custom_fields/thesis:thesis/department"

  [[sheet.field]]
  source = "department2"
  target = "/custom_fields/kcr:institution_department"

  [[sheet.field]]
  source = "author1_institution"
  target = "/custom_fields/thesis:thesis/university"
  transform = "author_institution"
  args = { prefix = "author", max = 5, default = "Bucknell University" }

  [[sheet.field]]
  source = "multimedia_format"
  target = "/custom_fields/kcr:media"
  transform = "split"
  args = { sep = "," }

  [[sheet.field]]
  source = "comments"
  target = "/metadata/additional_descriptions"
  transform = "additional_description"

  [[sheet.field]]
  source = "embargo_date"
  target = "/access"
  transform = "embargo"

  # no outside publisher: KC Works needs one to register the record's DOI
  [sheet.constants]
  "/metadata/publisher" = "Bucknell University"

