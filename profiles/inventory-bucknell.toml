# ------------------------------------------------------- everything else
# Rows from collections without client-specific instructions: the generic
# inventory baseline (events, symposia, working papers, OER, archives...).
[[sheet]]
match = "*"
collection = "inventory"
require_columns = ["context_key", "state", "document_type"]

  [sheet.filter]
  column = "state"
  keep = ["published"]

  [sheet.resource_type]
  column = "document_type"
  default = "textDocument-other"

  [sheet.resource_type.map]
  article = "textDocument-journalArticle"
  journalarticle = "textDocument-journalArticle"
  book_contribution = "textDocument-bookSection"
  popular_press = "textDocument-magazineArticle"
  book = "textDocument-book"
  bookreview = "textDocument-review"
  honors_thesis = "textDocument-thesis"
  honors_thesis_b = "textDocument-thesis"
  masters_thesis = "textDocument-thesis"
  masters_thesis_b = "textDocument-thesis"
  essay = "textDocument-essay"
  whitepaper = "textDocument-whitePaper"
  report = "textDocument-report"
  technicalreports = "textDocument-report"
  editorial = "textDocument-editorial"
  unpublished_paper = "textDocument-workingPaper"
  presentation = "presentation-other"
  poster = "presentation-conferencePoster"
  conference_paper = "presentation-conferencePaper"
  keynote = "presentation-other"
  keynote_presentation = "presentation-other"
  keynotepresentation = "presentation-other"
  interview = "audiovisual-interviewRecording"
  film = "audiovisual-videoRecording"
  accessfilm = "audiovisual-videoRecording"
  openaccessfilm = "audiovisual-videoRecording"
  bucknellaccessonlyfilm = "audiovisual-videoRecording"
  video = "audiovisual-videoRecording"
  audiomaterials = "audiovisual-audioRecording"
  performance = "audiovisual-performance"
  digital_project = "other-interactiveResource"
  dataset = "dataset"
  datasets = "dataset"
  Software = "software-other"
  Hardware = "other-physicalObject"
  exhibition = "other-event"
  conference = "other-event"
  workshop = "other-event"
  panel = "other-event"
  panel_discussion = "other-event"
  paneldiscussion = "other-event"
  demonstration = "other-event"
  breakout = "other-event"
  tour = "other-event"
  other = "textDocument-other"
  abstracts = "textDocument-abstract"
  installation = "image-visualArt"
  informationalworks = "textDocument-documentation"
  webbasedmaterials = "other-interactiveResource"
  # journal front matter, event programs and other minor print genres
  fullissue = "textDocument-other"
  full_issue = "textDocument-other"
  acknowledgements = "textDocument-other"
  contributors = "textDocument-other"
  introductions = "textDocument-other"
  newsletters = "textDocument-other"
  printmaterials = "textDocument-other"
  program = "textDocument-other"
  "Program (Publication)" = "textDocument-other"
  response = "textDocument-other"
  letter = "textDocument-other"
  # a whole journal issue deposited as one item
  journal = "textDocument-other"
  # KC Works type names used directly in the cleaned export
  journalArticle = "textDocument-journalArticle"
  poeticWork = "textDocument-poeticWork"
  review = "textDocument-review"
  bookSection = "textDocument-bookSection"
  onlinePublication = "textDocument-onlinePublication"
  interactiveResource = "other-interactiveResource"
  videoRecording = "audiovisual-videoRecording"
  musicalRecording = "audiovisual-musicalRecording"
  patent = "other-patent"
  proceedingsPaper = "textDocument-conferenceProceeding"
  conferencePoster = "presentation-conferencePoster"
  "textDocument/other" = "textDocument-other"

  [[sheet.field]]
  source = "title"
  target = "/metadata/title"
  transform = "plain_text"
  required = true

  # events (conferences, exhibitions...) carry no publication_date; their
  # start_date is the closest equivalent. Items with neither (some student
  # journal issues) take the date they were posted to Digital Commons, since
  # KC Works will not accept a record without a date.
  [[sheet.field]]
  source = "publication_date"
  target = "/metadata/publication_date"
  transform = "edtf_date"
  args = { season_column = "season", fallback_columns = ["start_date", "date_posted"] }
  required = true

  [[sheet.field]]
  source = "abstract"
  target = "/metadata/description"
  transform = "strip_html"

  [[sheet.field]]
  source = "keywords"
  target = "/custom_fields/kcr:user_defined_tags"
  transform = "split"
  args = { sep = [",", ";"] }

  [[sheet.field]]
  source = "disciplines"
  target = "/custom_fields/kcr:discipline"
  transform = "split"
  args = { sep = ";", join = ", " }

  [[sheet.field]]
  source = "department"
  target = "/custom_fields/kcr:institution_department"

  [[sheet.field]]
  source = "degree_name"
  target = "/custom_fields/kcr:degree"

  # the export's own publisher where it names one, else inferred
  [[sheet.field]]
  source = "publisher"
  target = "/metadata/publisher"
  transform = "publisher"
  args = { doi_columns = ["doi"], link_columns = ["pub_link"] }

  [[sheet.field]]
  source = "doi"
  target = "/metadata/identifiers"
  append = true
  transform = "identifier"
  args = { scheme = "doi", normalize = "doi" }

  [[sheet.field]]
  source = "isbn"
  target = "/metadata/identifiers"
  append = true
  transform = "identifier"
  args = { scheme = "isbn", split = ";" }

  [[sheet.field]]
  source = "language"
  target = "/metadata/languages"
  transform = "language_list"

  [[sheet.field]]
  source = "distribution_license"
  target = "/metadata/rights"
  transform = "license_url"

  # odt convention: work-level URLs are identifiers; kcr:publication_url is
  # reserved for series-level URLs (none identified in this export)
  [[sheet.field]]
  source = "pub_link"
  target = "/metadata/identifiers"
  append = true
  transform = "identifier"
  args = { scheme = "url", doi_references = true, find_url = true, unproxy = ["ezproxy.bucknell.edu"] }

  [[sheet.field]]
  source = "embargo_date"
  target = "/access"
  transform = "embargo"

  [sheet.contributors]
  prefix = "advisor"
  max = 3
  role = "committeeMember"

  [sheet.journal]
  title = "src_journal"
  volume = "volnum"
  issue = "issnum"
  issn = "issn"
  pages = { first = "fpage", last = "lpage" }

  [sheet.imprint]
  place = "city"
