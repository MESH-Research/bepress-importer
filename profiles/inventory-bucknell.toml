# Bucknell Content Inventory export → KC Works mapping profile.
#
# A Content Inventory export is a single flattened table: every collection's
# rows with the union of all columns (~585), arriving either as a cp1252 CSV
# or as a "Content Inventory" .xlsx workbook (data sheet plus a "Field Names"
# legend sheet, which `require_columns` keeps out of the conversion). Rows
# carry a `state` column; only `published` rows are imported. Records are
# keyed on `context_key`; inventory exports carry no calc_url, so no url
# identifier is emitted.
#
# `signature_columns` marks this as an inventory profile: `convert` refuses
# to run it against an export that lacks these columns, and suggests it when
# a non-matching profile is passed for an inventory workbook.
#
# The `publication` column holds each row's collection slug, so the
# collection-specific mappings agreed for the Bucknell collection export
# (profiles/bucknell.toml, per bucknell_mapping.odt — see
# profiles/bucknell_remapping.MD) are reproduced here as selected groups:
# rows are routed to the first [[sheet]] block whose `select` matches their
# publication, and everything else falls to the generic catch-all group at
# the end (collection "inventory").
#
# Differences from bucknell.toml forced by the inventory format:
#   - no calc_url column → no url identifier on any record
#   - BU Digital Scholarship: fulltext_url does not exist in inventory
#     exports, so that identifier mapping is dropped
#   - author columns run to author72 in this export (max = 72 below)
#
# Deliberately unmapped columns (documented, not accidental): the export
# contains dozens of sparsely-used per-collection columns (exhibition,
# performance, patent, geodata fields, workflow/admin fields such as
# submission_date, submitted_by, open_access, address/phone fields, etc.).
# Run `bepress-importer inspect --profile` for the full unmapped list on a
# given export.

[profile]
name = "inventory-bucknell"
schema_version = 1
signature_columns = ["context_key", "state", "document_type"]

[defaults]
record_id.column = "context_key"
files_enabled = false
season_style = "edtf-season"

[defaults.author_columns]
prefix = "author"
max = 72

# ---------------------------------------------------------------- journals
[[sheet]]
match = "*"
collection = "fac_journ"
require_columns = ["context_key", "state", "document_type"]
select = { column = "publication", values = ["fac_journ"] }

  [sheet.filter]
  column = "state"
  keep = ["published"]

  [sheet.resource_type]
  column = "document_type"
  map = { article = "textDocument-journalArticle", journalarticle = "textDocument-journalArticle", book_contribution = "textDocument-bookSection", popular_press = "textDocument-magazineArticle", bookreview = "textDocument-review", editorial = "textDocument-editorial", other = "textDocument-other" }
  default = "textDocument-journalArticle"

  [[sheet.field]]
  source = "title"
  target = "/metadata/title"
  required = true

  [[sheet.field]]
  source = "publication_date"
  target = "/metadata/publication_date"
  transform = "edtf_date"
  args = { season_column = "season" }
  required = true

  [[sheet.field]]
  source = "abstract"
  target = "/metadata/description"
  transform = "strip_html"

  [[sheet.field]]
  source = "keywords"
  target = "/custom_fields/kcr:user_defined_tags"
  transform = "split"
  args = { sep = "," }

  [[sheet.field]]
  source = "disciplines"
  target = "/custom_fields/kcr:discipline"
  transform = "split"
  args = { sep = ";", join = ", " }

  [[sheet.field]]
  source = "department"
  target = "/custom_fields/kcr:institution_department"

  [[sheet.field]]
  source = "pub_link"
  target = "/metadata/identifiers"
  transform = "identifier"
  args = { scheme = "url" }
  append = true

  [[sheet.field]]
  source = "doi"
  target = "/metadata/identifiers"
  transform = "identifier"
  args = { scheme = "doi", normalize = "doi" }
  append = true

  [[sheet.field]]
  source = "comments"
  target = "/metadata/additional_descriptions"
  transform = "additional_description"
  append = true

  [[sheet.field]]
  source = "custom_citation"
  target = "/metadata/additional_descriptions"
  transform = "additional_description"
  append = true

  [[sheet.field]]
  source = "pub_statement"
  target = "/metadata/copyright"
  transform = "strip_html"

  [[sheet.field]]
  source = "embargo_date"
  target = "/access"
  transform = "embargo"

  [sheet.journal]
  title = "src_journal"
  volume = "volnum"
  issue = "issnum"
  pages = { first = "fpage", last = "lpage" }

