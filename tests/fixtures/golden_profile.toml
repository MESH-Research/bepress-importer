[profile]
name = "golden"
schema_version = 1

[defaults]
record_id.column = "context_key"
url_identifier.column = "calc_url"
files_enabled = false

[defaults.author_columns]
prefix = "author"
max = 2

[[sheet]]
match = "journal"

  [sheet.resource_type]
  column = "document_type"
  map = { article = "textDocument-journalArticle", popular_press = "textDocument-magazineArticle" }

  [[sheet.field]]
  source = "title"
  target = "/metadata/title"
  required = true

  [[sheet.field]]
  source = "publication_date"
  target = "/metadata/publication_date"
  transform = "edtf_date"
  args = { season_column = "season" }
  required = true

  [[sheet.field]]
  source = "abstract"
  target = "/metadata/description"
  transform = "strip_html"

  [[sheet.field]]
  source = "keywords"
  target = "/custom_fields/kcr:user_defined_tags"
  transform = "split"
  args = { sep = "," }

  [[sheet.field]]
  source = "disciplines"
  target = "/custom_fields/kcr:discipline"
  transform = "split"
  args = { sep = ";", join = ", " }

  [[sheet.field]]
  source = "department"
  target = "/custom_fields/kcr:institution_department"

  [[sheet.field]]
  source = "pub_link"
  target = "/custom_fields/kcr:publication_url"
  transform = "url"

  [[sheet.field]]
  source = "doi"
  target = "/metadata/identifiers"
  transform = "identifier"
  args = { scheme = "doi", normalize = "doi" }

  [[sheet.field]]
  source = "embargo_date"
  target = "/access"
  transform = "embargo"

  [sheet.journal]
  title = "src_journal"
  volume = "volnum"
  issue = "issnum"
  pages = { first = "fpage", last = "lpage" }
